<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Mavi-mor gradient yuvarlatılmış kare arka plan -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Beyaz cüzdan gövdesi (iç güvenli bölgede) -->
  <g transform="translate(116, 156)">
    <rect width="280" height="200" rx="28" fill="#ffffff"/>
    <!-- Yatay aksan şerit -->
    <rect y="80" width="280" height="36" fill="#e0e7ff"/>
    <!-- Cüzdan klipsi -->
    <circle cx="220" cy="98" r="16" fill="#8b5cf6"/>
    <circle cx="220" cy="98" r="6" fill="#ffffff"/>
  </g>
</svg>
