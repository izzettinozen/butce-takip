<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <title>Çevrimdışı · Bütçe Takip</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #f8fafc; }
        p { color: #94a3b8; }
      }
      .card { max-width: 24rem; }
      .ikon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 28px;
      }
      h1 { font-size: 1.375rem; margin: 0 0 .5rem; font-weight: 600; }
      p { margin: 0 0 1.5rem; color: #64748b; line-height: 1.5; }
      button {
        padding: .625rem 1.25rem;
        border: none;
        border-radius: .625rem;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 500;
      }
      button:hover { opacity: .92; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="ikon">⚡</div>
      <h1>Çevrimdışısınız</h1>
      <p>İnternet bağlantınız kesildi. Bağlantı geri geldiğinde sayfayı yenileyin.</p>
      <button type="button" onclick="location.reload()">Yeniden Dene</button>
    </div>
  </body>
</html>
